  if(c("ceil"))rows.push(["CEILING BANK",400*c("ceil")]);
  if(c("floor"))rows.push([c("floor")>1?"FLOOR SKIP x"+c("floor"):"FLOOR SKIP",150*c("floor")]);
  if(c("slam"))rows.push(["SLAM DUNK",200]);
  if(c("bed"))rows.push(["BED BOUNCE",350]);
  if(c("tramp"))rows.push(["TRAMPOLINE",400]);
  if(c("box"))rows.push(["RICOCHET",200*Math.min(3,c("box"))]);
  if(c("fan"))rows.push(["FAN SMACK",500]);
  if(c("cat"))rows.push(["CAT BOUNCE",300]);
  if(c("pend"))rows.push(["LAMP SMACK",400]);
  if(c("gate"))rows.push(["DOOR KNOCK",300]);
  if(c("belt"))rows.push(["CONVEYOR",300]);
  if(windT>.15)rows.push(["AGAINST THE WIND",300]);
  if(!["wall","ceil","floor","bed","box","fan","tramp","cat","pend","gate","belt"].some(k=>c(k)))rows.push(["NOTHING BUT SOCKET",250]);
  if(room.target.kind==="vac")rows.push(["MOVING TARGET",300]);
  if(throws===1)rows.push(["FIRST TRY",500]);
  if(battery===0)rows.push(["LAST PERCENT",400]);
  const total=rows.reduce((s,r)=>s+r[1],0),bolts=1+(total>=PAR[0])+(total>=PAR[1]);lastScore={rows,total,bolts};
  if(daily){if(total>(daily.best||0))daily.best=total;submitScore("daily",total);}
  else if(!endless){const nm=ROOMS[ri].name;if(!prog.best[nm]||total>prog.best[nm])prog.best[nm]=total;if(!prog.bolts[nm]||bolts>prog.bolts[nm])prog.bolts[nm]=bolts;prog.max=Math.max(prog.max,Math.min(ri+1,ROOMS.length-1));save();}
  else{endless.score+=total;battery=Math.min(9,battery+2);}
  callouts=rows.slice(1).map(r=>({t:r[0],p:"+"+r[1]}));if(!callouts.length)callouts=[{t:"PLUGGED IN",p:"+1000"}];if(endless)callouts.push({t:"+2% BATTERY",p:""});}

function startMusic(){nextT=ac.currentTime+.1;setInterval(()=>{if(!ac)return;const spb=60/92/4;while(nextT<ac.currentTime+.15){const bar=Math.floor(step16/16)%4,st=step16%16,ch=CH[bar];
  if(st===0||st===8)tone(ch[0]-12,nextT,spb*7,"triangle",.16,musicLP);if(st===6||st===14)tone(ch[0]-12,nextT,spb*1.5,"triangle",.1,musicLP);
  tone(ch[st%4]+12,nextT,spb*.9,"square",.022,musicLP);if(st%2===0)hat(nextT,st%4===0?.035:.018);
  const m=MEL[(Math.floor(step16/2))%MEL.length];if(step16%2===0&&m&&Math.floor(step16/64)%2===1)tone(m,nextT,spb*3,"square",.035,musicLP);
  nextT+=spb;step16++;}},30);}
function blip(f,d,type="square",v=.08,f2){if(!ac||sim)return;const t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  gn.gain.setValueAtTime(v,t);gn.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(gn);gn.connect(master);o.start(t);o.stop(t+d+.02);}
const sfx={throw:()=>blip(220,.18,"square",.06,880),plug:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>blip(f,.12,"square",.07),i*70));},
  dead:()=>blip(440,.7,"square",.06,60),thunder:()=>{if(!ac||sim)return;const t=ac.currentTime,b=ac.createBuffer(1,ac.sampleRate*1.4,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2);const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type="lowpass";f.frequency.value=260;const gn=ac.createGain();gn.gain.value=.5;s.connect(f);f.connect(gn);gn.connect(master);s.start(t);},click:()=>blip(660,.05,"square",.05),stretch:()=>blip(90,.03,"triangle",.03)};

  else if(r<.7)target={kind:"floor",x:Math.round(rr(150,290))};else if(r<.82)target={kind:"left",y:Math.round(rr(40,100))};
  else{target={kind:"vac"};vacDef={x0:Math.round(rr(100,140)),x1:Math.round(rr(220,270)),speed:Math.round(rr(35,70))};}
  const spans=[],free=(x,w)=>x>=86&&x+w<=310&&spans.every(([a,b])=>x+w<a-6||x>b+6);

    if(t==="shelf")props.push({t,x,top:Math.round(rr(72,120))});else if(t==="wardrobe")props.push({t,x,w:44,top:Math.round(rr(62,110))});
    else if(t==="nightstand")props.push({t,x,lamp:RNG()<.6});else if(t==="stool"){props.push({t,x});if(!fanDef&&RNG()<.7)fanDef={x:x+7,y:110,dir:-1,zone:[Math.max(60,x-110),92,110,40],force:Math.round(rr(380,600))};}else props.push({t,x});}
  const mechs=n<2?0:n<7?1:2;

    if(m==="pend")movers.push({type:"pend",x:Math.round(rr(130,270)),len:Math.round(rr(45,85)),amp:rr(.5,.85),period:rr(1.8,2.8)});

function drawNotif(c,real){if(!notif)return;notif.t+=real;const t=notif.t;if(t<0)return;if(t>4.4){notif=null;return;}if(t<real*1.5){blip(1320,.05,"square",.04);setTimeout(()=>blip(1760,.07,"square",.04),70);}
  const k=t<.25?t/.25:t>4.1?(4.4-t)/.3:1,w=Math.max(textW(notif.msg),textW(notif.from))+24,x=Math.round(W/2-w/2),y=Math.round(-22+k*40);
  c.globalAlpha=.5;rrect(c,x+2,y+2,w,19,"x");c.globalAlpha=1;rrect(c,x,y,w,19,"#efeaf6");rrect(c,x+3,y+4,11,11,"n",1);rect(c,x+5,y+7,7,4,"w");rect(c,x+6,y+11,2,2,"w");
  text(c,notif.from,x+18,y+3,"R");text(c,notif.msg,x+18,y+11,"k");}
/* ---------------- main loop ---------------- */
let last=performance.now(),sim=false;
function frame(now){requestAnimationFrame(frame);let real=Math.min(.05,(now-last)/1000);last=now;buttons=[];
  if(mode==="gen"){stepGen();if(mode==="gen"){drawGen(g);return;}}
  if(room)updateRopeLen(real);kidT+=real;catAlert-=real;if(mode==="fly"&&Math.hypot(plug.x-108,plug.y-68)<26)catAlert=1.4;
  if(hitStop>0){hitStop-=real;real=0;}
  if(mode==="title"||mode==="ready"||mode==="style"||mode==="scores"){simT+=real;moveThings(real);}
  if(mode==="fly"){
    const s=sockets()[0];let near=false;if(s){const dx=s.x-plug.x,dy=s.y-plug.y;near=Math.hypot(dx,dy)<34&&(plug.vx-s.vx)*-s.nx+(plug.vy-s.vy)*-s.ny>20;}
    slow+=((near?.22:1)-slow)*Math.min(1,real*12);
    const dt=real*slow,n=Math.max(1,Math.ceil(dt/(1/480)));let res=null;
    for(let i=0;i<n&&!res;i++)res=step(dt/n);flyT+=real;if(ghost.length<900)ghost.push({x:plug.x,y:plug.y});
    if(res==="snap"){mode="snap";snapT=0;hitStop=.09;}
    else if(still>.45||flyT>7){mode="rest";kidT=0;snapT=0;ghostLast=ghost;const nb=(tr.wall||0)+(tr.floor||0)+(tr.box||0)+(tr.ceil||0);pushCall(reason||(nb?"NO SOCKET":"NOPE"),battery>0?battery+"% LEFT":"",true,1.1);}
    ropeStep(Math.max(dt,.001),true);if(mode==="fly"||mode==="snap")snapshot();}
  if(mode==="snap"){snapT+=real/.12;simT+=real;moveThings(real);const s=target=sockets()[0];const tx=s.x+s.nx*10,ty=s.y+s.ny*10,ta=Math.atan2(-s.ny,-s.nx);const k=Math.min(1,snapT);
    plug.x+=(tx-plug.x)*k;plug.y+=(ty-plug.y)*k;let da=Math.atan2(Math.sin(ta-plug.a),Math.cos(ta-plug.a));plug.a+=da*k;ropeStep(real,true);snapshot();
    if(k>=1){mode="won";snapT=0;kidT=0;flashT=.09;sfx.plug();shake=2;for(let i=0;i<40;i++)parts.push({x:s.x,y:s.y,vx:(Math.random()-.5)*160+s.nx*80,vy:(Math.random()-.5)*160+s.ny*80,life:.6+Math.random()*.5,c:["y","m","w","n"][i%4]});scoreIt();}}
  if(mode==="won"){simT+=real;moveThings(real);const s=sockets()[0];plug.x=s.x+s.nx*10;plug.y=s.y+s.ny*10;plug.a=Math.atan2(-s.ny,-s.nx);ropeStep(real,true);snapT+=real;
    if(callT<=0&&callouts.length){const c=callouts.shift();pushCall(c.t,c.p,false,.75);sfx.click();}
    if(!callouts.length&&callT<=0&&snapT>1.1&&!replayed)startReplay();}
  if(mode==="replay"){const s=rec[Math.min(rec.length-1,Math.floor(rI))];const sp=s.sl<.6?.3:.75;rI+=sp*real*60;
    if(rI>=rec.length-1){replayHold+=real;applySnap(rec[rec.length-1]);if(replayHold>.5){mode="won";snapT=2;flashT=.06;}}else applySnap(s);}
  if(mode==="rest"){snapT+=real;
    if(battery<=0){ropeStep(real,true);if(snapT>1.1){mode="dead";kidT=0;sfx.dead();if(endless){endless.newBest=endless.score>(prog.endBest||0);prog.endBest=Math.max(prog.endBest||0,endless.score);save();submitScore("endless",endless.score,{rooms:endless.n-1});}}}
    else if(snapT>.6){if(!reeling){reeling=true;reelT=0;reelFrom={x:plug.x,y:plug.y,a:plug.a,len:ropeLen,shape:rope.map(p=>({x:p.x,y:p.y}))};blip(900,.22,"triangle",.04,300);}
      reelT+=real;const D=.5,k=Math.min(1,reelT/D),e=k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
      const top=Math.min(reelFrom.y,HAND.y)-10-Math.min(30,Math.abs(reelFrom.x-HAND.x)*.12),u=1-e;
      plug.x=u*u*reelFrom.x+2*u*e*((reelFrom.x+HAND.x)/2)+e*e*HAND.x;plug.y=u*u*reelFrom.y+2*u*e*top+e*e*HAND.y;
      plug.a=reelFrom.a+Math.atan2(Math.sin(-.4-reelFrom.a),Math.cos(-.4-reelFrom.a))*e;
      cableCurve(plug.x-Math.cos(plug.a)*5,plug.y-Math.sin(plug.a)*5,curveTmp);
      for(let i=0;i<RN;i++){const s=reelFrom.shape[i],c=curveTmp[i],ti=i/(RN-1),w=Math.min(1,e+(1-e)*Math.pow(ti,3));rope[i].x=s.x+(c.x-s.x)*w;rope[i].y=s.y+(c.y-s.y)*w;if(i>0&&i<RN-1)ropePush(rope[i]);ropePrev[i].x=rope[i].x;ropePrev[i].y=rope[i].y;}
      ropeLen=reelFrom.len+(readyLen()-reelFrom.len)*e;if(k>=1){reeling=false;toReady();}}
    else ropeStep(real,true);}
  if(mode==="ready"){plug.x=HAND.x;plug.y=HAND.y;plug.a=aimV?Math.atan2(aimV.y,aimV.x):-.4;cleanCable();}
  if(mode==="title"||mode==="style"||mode==="scores")cleanCable();
  for(const p of parts){p.vy+=(p.g===undefined?300:p.g)*real;p.x+=p.vx*real;p.y+=p.vy*real;p.life-=real;}for(let i=parts.length-1;i>=0;i--)if(parts[i].life<=0)parts.splice(i,1);
  for(const f of feed)f.life-=real;feed=feed.filter(f=>f.life>0);
  callT-=real;bannerT-=real;
  if(musicLP)musicLP.frequency.setTargetAtTime((mode==="fly"&&slow<.6)||mode==="replay"?700:5000,ac.currentTime,.08);
  if(room&&room.theme.sky==="storm"&&mode!=="title"){if(lightT<=0&&Math.random()<real/6){lightT=.4;setTimeout(()=>sfx.thunder(),350);}}lightT-=real;
  // compose
  drawWorld(sg);
  g.save();if(shake>0){g.translate(Math.round((Math.random()-.5)*shake*2),Math.round((Math.random()-.5)*shake*2));shake=Math.max(0,shake-real*12);}
  g.drawImage(scene,0,0);g.restore();
  if(mode!=="title"&&mode!=="replay"&&mode!=="style"&&mode!=="scores"){drawHUD(g);
    const s=sockets()[0];const near=s&&(mode==="snap"||mode==="won"&&snapT<1.6||mode==="fly"&&slow<.6);if(near)drawSocketCam(g);}
  if(bannerT>0&&mode==="ready"){const a=bannerA,b=bannerB;const y=62;text(g,a,W/2-textW(a,4)/2+2,y+2,"k",4);text(g,a,W/2-textW(a,4)/2,y,"y",4);textC(g,b,W/2,y+26,"w",2,"k");}
  if(lightT>0&&Math.floor(lightT*20)%2&&mode!=="title"){g.globalAlpha=.16;rect(g,0,0,W,H,"#dfe8ff");g.globalAlpha=1;}
  if(wipe>0){for(let by=0;by<H;by+=10)for(let bx=0;bx<W;bx+=10){const k=wipe*1.6-(bx/W*.8+by/H*.4);if(k>0){const s=Math.min(10,Math.ceil(k*14));rect(g,bx+(10-s)/2,by+(10-s)/2,s,s,"k");}}wipe-=real*1.8;}
  if(flashT>0){g.globalAlpha=Math.min(1,flashT*8)*.6;rect(g,0,0,W,H,"w");g.globalAlpha=1;flashT-=real;}
  drawCallout(g);
  if(mode==="won"&&!callouts.length&&callT<=0&&snapT>1&&replayed)drawWin(g);
  if(mode==="replay")drawReplay(g);
  if(mode==="dead")drawDead(g);
  if(mode==="title")drawTitle(g);
  if(mode==="style")drawStyle(g);
  if(mode==="scores")drawScores(g);
  if(mode==="ready"||mode==="fly")drawNotif(g,real);else if(notif&&mode!=="rest")notif=null;
}

/* ---------------- sizing ---------------- */
function fit(){const vw=innerWidth,vh=innerHeight;let s=Math.min(vw/W,vh/H);if(s>=2)s=Math.floor(s);cv.style.width=Math.round(W*s)+"px";cv.style.height=Math.round(H*s)+"px";}
addEventListener("resize",fit);fit();

/* test hook: simulate a throw instantly */
window.__ps={room:i=>loadRoom(i),get mode(){return mode;},
  sim(vx,vy,t0=0){const ok=simThrow(vx,vy,t0);const out={res:ok?'snap':null,reason};battery=3;throws=0;simT=0;moveThings(0);toReady();return out;},endless:()=>startEndless(),daily:()=>startDaily(),scores:()=>{mode='scores';},genStats(n,k){const out=[];for(let i=0;i<k;i++){const r=genRoom(n);setupRoom(r);const it=validator(r);let v;while(!(v=it.next()).done);out.push(v.value.wins+'/'+v.value.n+':'+r.target.kind);}return out.join(' ');},style:()=>{mode='style';},
  ropeSample(){return rope.map(p=>[p.x,p.y]);},get dbg(){return [mode,plug.x.toFixed(1),plug.y.toFixed(1),ropeLen.toFixed(1),reeling,reelT.toFixed(2),snapT.toFixed(2)].join(" ");},spriteSheet(){const [c,x]=off(8*24,6*24);x.fillStyle="#2b2440";x.fillRect(0,0,c.width,c.height);
    for(let i=0;i<32;i++)x.drawImage(PLUGSETS[0][0][i],(i%8)*24+2,Math.floor(i/8)*24+2);
    const hh=4;[false,true].forEach((lit,k)=>{drawSocketAt(x,30+k*60,4*24+24,-1,0,hh,lit);drawSocketAt(x,40+k*60,4*24+24,1,0,hh,lit);});
    drawSocketAt(x,140,4*24+4,0,1,hh,false);drawSocketAt(x,170,6*24-2,0,-1,hh,true);
    x.drawImage(PLUGSETS[0][1][16],150,4*24+20);return c.toDataURL();},genCampaign(seed,n){RNG=mulberry(seed);const r=genRoom(n);RNG=Math.random;setupRoom(r);let it=validator(r),v;while(!(v=it.next()).done);let wins=v.value.wins,tot=v.value.n;
    if(wins>=3&&wins/tot>.05){r.tol=Math.max(3,Math.round(r.tol*.7));setupRoom(r);it=validator(r);while(!(v=it.next()).done);wins=v.value.wins;tot=v.value.n;}
    const out={...r};delete out.theme;return JSON.stringify({room:out,wins,tot});},camTest(r){loadRoom(r);const s=sockets()[0];target=s;tr={last:{}};plug.x=s.x+s.nx*10;plug.y=s.y+s.ny*10;plug.a=Math.atan2(-s.ny,-s.nx);mode="won";snapT=0;callouts=[];replayed=true;},get roomInfo(){return JSON.stringify({n:room.name,t:room.target,p:room.props,m:room.movers,tol:room.tol});},start:i=>startRoom(i),throw:(vx,vy)=>throwPlug(vx,vy)};
loadRoom(nextRoom());mode="title";requestAnimationFrame(frame);initOnline();
})();
